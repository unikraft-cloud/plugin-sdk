version: 3

# Every Go module in this repository is a member of `go.work` *and* a module in
# its own right.  Module-scoped checks (notably `go mod tidy -diff`) must see
# the module's own `go.mod` rather than the workspace's merged resolution, so
# the per-module taskfiles below are always invoked with `GOWORK=off`.

includes:
  golang:
    taskfile: ./go/Taskfile.yml
    dir: ./go

env:
  GOWORK: "off"

tasks:
  default:
  - task: golang:default
  - task: sdkgen:default

  # ci tasks

  ci/check:
  - task: golang:go:ci/check

  ci/test:
  - task: golang:go:ci/test
